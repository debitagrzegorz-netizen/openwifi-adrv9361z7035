# Load cfg80211/mac80211 after rootfs is available so regulatory.db can be
# loaded from /lib/firmware instead of failing during early built-in init.
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_NL80211_TESTMODE=y
CONFIG_CFG80211_WEXT=y
CONFIG_MAC80211_HAS_RC=y
CONFIG_MAC80211_RC_MINSTREL=y
CONFIG_PACKET=y

# Built-in (=y) probes during xilinx_vdma_driver_init before AD9361 RF clocks
# exist. OpenWiFi AXI DMA s_axi_lite is clocked from AD9361-derived clk_wiz,
# not FCLK0 — early MMIO hangs the bus. Load as module after AD9361 is up.
CONFIG_XILINX_DMA=m

# ADI AXI HDMI / video RX need built-in XILINX_DMA symbols (vdma API).
# OpenWiFi PL has no HDMI / VDMA; disable so XILINX_DMA can be modular.
# CONFIG_DRM_ADI_AXI_HDMI is not set
# CONFIG_VIDEO_AXI_HDMI_RX is not set
