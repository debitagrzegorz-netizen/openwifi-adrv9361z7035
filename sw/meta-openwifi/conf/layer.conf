BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-openwifi"
BBFILE_PATTERN_meta-openwifi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-openwifi = "20"
LAYERVERSION_meta-openwifi = "1"
LAYERSERIES_COMPAT_meta-openwifi = "scarthgap"

WKS_SEARCH_PATH:prepend := "${LAYERDIR}/wic:"

# The FSBL multiconfig builds a bare-metal device tree. meta-adi's append
# copies kernel DTS files, and that multiconfig's kernel is linux-dummy.
BBMASK:append = "${@' /meta-adi-xilinx/recipes-bsp/device-tree/' if d.getVar('BB_CURRENT_MC') == 'xlnx-zynq-7000-cortexa9-fsbl' else ''}"
